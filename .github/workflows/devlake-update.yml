# Checks daily for a new DevLake release (stable or pre-release). When one is
# found it regenerates the spec and client, runs unit and integration tests
# against that DevLake version, and opens a pull request with an API
# changelog. Merging the PR triggers the release workflow.
#
# Optional configuration:
#   secrets.DEVLAKE_BOT_TOKEN      PAT / app token used to open the PR. With the
#                                  default GITHUB_TOKEN, CI does not run on the
#                                  PR automatically (GitHub limitation).
#   vars.AUTO_MERGE_UPDATES=true   enable auto-merge on update PRs (requires
#                                  "Allow auto-merge" in the repo settings).
name: DevLake update

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      devlake_version:
        description: DevLake tag to update to (default newest tag)
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: devlake-update
  cancel-in-progress: false

env:
  GOTOOLCHAIN: auto

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Detect DevLake version
        id: detect
        env:
          REQUESTED: ${{ inputs.devlake_version }}
        run: |
          latest="${REQUESTED:-$(scripts/latest-devlake-version.sh)}"
          if ! [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid DevLake version '$latest'"; exit 1
          fi
          current="$(cat spec/DEVLAKE_VERSION)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "Already on DevLake $current"
            echo "update=false" >> "$GITHUB_OUTPUT"
          elif ! docker manifest inspect "apache/devlake:$latest" >/dev/null 2>&1; then
            echo "::notice::DevLake $latest is tagged but apache/devlake:$latest is not published yet; retrying next run"
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updating DevLake $current -> $latest"
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate spec and client
        if: steps.detect.outputs.update == 'true'
        env:
          LATEST: ${{ steps.detect.outputs.latest }}
        run: |
          make spec DEVLAKE_VERSION="$LATEST"
          make generate DEVLAKE_VERSION="$LATEST"
          go build ./...
          go vet ./...

      - name: Unit tests
        if: steps.detect.outputs.update == 'true'
        run: |
          go test -race ./...
          (cd tools && go test ./...)

      - name: Integration tests against the new DevLake
        if: steps.detect.outputs.update == 'true'
        run: |
          make devlake-up
          make test-integration

      - name: DevLake logs
        if: failure() && steps.detect.outputs.update == 'true'
        run: DEVLAKE_VERSION=$(cat spec/DEVLAKE_VERSION) docker compose -f integration/docker-compose.yml logs devlake | tail -300

      - name: API changelog
        if: steps.detect.outputs.update == 'true'
        env:
          LATEST: ${{ steps.detect.outputs.latest }}
          CURRENT: ${{ steps.detect.outputs.current }}
        run: |
          {
            echo "Updates the client from DevLake \`$CURRENT\` to \`$LATEST\`."
            echo
            echo "Generated by the DevLake update workflow. Unit and integration tests"
            echo "(DevLake \`$LATEST\` on PostgreSQL) passed before this PR was opened."
            echo "Merging releases client \`$LATEST\`."
            echo
            echo "## API changes"
            echo
            scripts/api-changelog.sh
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        if: steps.detect.outputs.update == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DEVLAKE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          branch: devlake-update/${{ steps.detect.outputs.latest }}
          delete-branch: true
          title: Update to DevLake ${{ steps.detect.outputs.latest }}
          commit-message: Update to DevLake ${{ steps.detect.outputs.latest }}
          body-path: ${{ runner.temp }}/pr-body.md
          labels: devlake-update
          add-paths: |
            spec/**
            devlakeapi/**

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number && vars.AUTO_MERGE_UPDATES == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEVLAKE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR" --repo "$GITHUB_REPOSITORY"

      - name: Stop DevLake
        if: always() && steps.detect.outputs.update == 'true'
        run: make devlake-down
