name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: auto

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Spec tooling tests
        working-directory: tools
        run: go test ./...

  integration:
    name: Integration (DevLake + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start DevLake
        run: make devlake-up
      - name: Integration tests
        run: make test-integration
      - name: DevLake logs
        if: failure()
        run: DEVLAKE_VERSION=$(cat spec/DEVLAKE_VERSION) docker compose -f integration/docker-compose.yml logs devlake | tail -300
      - name: Stop DevLake
        if: always()
        run: make devlake-down

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make generate
      - name: Check for drift
        run: |
          if ! git diff --exit-code -- spec devlakeapi; then
            echo "::error::Generated files are stale. Run 'make generate' and commit the result."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --build-tags integration
